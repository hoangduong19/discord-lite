<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Realtime Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <style>
        body { font-family: Arial; }
        #chat {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }
        .system { color: gray; }
    </style>
</head>
<body>

<h3>Realtime Chat – channel 1</h3>

<!-- LOGIN (DEV ONLY) -->
<div>
    <input id="username" placeholder="username">
    <input id="password" placeholder="password" type="password">
    <button onclick="login()">Login</button>
</div>
<br>

<div id="chat"></div>

<input id="msg" placeholder="Type message..." style="width: 70%">
<button onclick="send()">Send</button>

<script>
    const CHANNEL_ID = 1;
    const chatBox = document.getElementById("chat");

    let client = null;
    let wsConnected = false;

    /* ========= LOGIN ========= */
    function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        fetch("http://localhost:8080/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        })
        .then(res => {
            if (!res.ok) throw new Error("Login failed");
            return res.json();
        })
        .then(data => {
            localStorage.setItem("jwt", data.token);
            log("🟢 Login success");
            connectWebSocket();
        })
        .catch(err => alert(err.message));
    }

    /* ========= CONNECT WS ========= */
    function connectWebSocket() {
        if (client && client.active) {
            console.log("WS already connected");
            return;
        }
        const TOKEN = localStorage.getItem("jwt");
        if (!TOKEN) {
            alert("Chưa login!");
            return;
        }

        wsConnected = false;

        client = new StompJs.Client({
            brokerURL: "ws://localhost:8080/ws",
            connectHeaders: {
                Authorization: "Bearer " + TOKEN
            },
            debug: () => {},

            onConnect: () => {
                wsConnected = true;
                log("🟢 WebSocket connected");

                client.subscribe("/topic/channel/" + CHANNEL_ID, msg => {
                    const data = JSON.parse(msg.body);
                    renderMessage(data);
                });
            },

            onStompError: err => {
                console.error("STOMP error", err);
            }
        });

        client.activate();
    }

    /* ========= SEND ========= */
    function send() {
        if (!wsConnected) {
            alert("WebSocket đang kết nối, chờ xíu...");
            return;
        }

        const input = document.getElementById("msg");
        const text = input.value.trim();
        if (!text) return;

        client.publish({
            destination: "/app/chat.send",
            body: JSON.stringify({
                type: "CHANNEL",
                targetId: CHANNEL_ID,
                content: text
            })
        });

        input.value = "";
    }

    /* ========= UI ========= */
    function renderMessage(data) {
        const div = document.createElement("div");
        div.innerHTML = `<b>${data.username}</b>: ${data.content}`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function log(text) {
        const div = document.createElement("div");
        div.style.color = "gray";
        div.innerText = text;
        chatBox.appendChild(div);
    }

    // 🔥 AUTO CONNECT KHI RELOAD
    if (localStorage.getItem("jwt")) {
        connectWebSocket();
    }
</script>

</body>
</html>
